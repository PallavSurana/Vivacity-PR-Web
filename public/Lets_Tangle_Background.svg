<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Let's Tangle dance event artwork</title>
  <desc id="desc">A warm abstract dance poster showing two figures connected by flowing lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30102e"/>
      <stop offset="0.5" stop-color="#8e3159"/>
      <stop offset="1" stop-color="#f0a34b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="35%">
      <stop stop-color="#ffe38b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb24f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="610" cy="250" r="330" fill="url(#sun)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M60 225 C260 30 315 545 545 305 S845 60 1140 255" stroke="#ffd875" stroke-width="13" opacity=".85"/>
    <path d="M50 390 C245 180 330 650 550 380 S850 160 1150 420" stroke="#60e0d1" stroke-width="8" opacity=".78"/>
    <path d="M85 560 C290 320 370 765 585 470 S870 325 1135 570" stroke="#ff6f9b" stroke-width="5" opacity=".9"/>
  </g>
  <g fill="none" stroke="#fff4dc" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="470" cy="260" r="35" stroke-width="13"/>
    <path d="M465 300 L430 440 L350 560 M435 345 L555 390 L665 315 M430 440 L540 555" stroke-width="21"/>
    <circle cx="750" cy="255" r="35" stroke-width="13"/>
    <path d="M744 298 L770 438 L875 555 M765 350 L665 315 L570 405 M770 438 L650 555" stroke-width="21"/>
  </g>
  <g fill="#fff4dc" font-family="Arial, sans-serif">
    <text x="72" y="105" font-size="22" letter-spacing="7">DANCE DISTRICT / 03</text>
    <text x="70" y="680" font-size="92" font-weight="800" letter-spacing="-3">LET'S TANGLE</text>
    <text x="76" y="730" font-size="19" letter-spacing="5">CONNECTION. RHYTHM. PERFORMANCE.</text>
  </g>
  <path d="M76 142 H280" stroke="#60e0d1" stroke-width="5"/>
